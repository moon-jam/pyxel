name: Publish Pyxel Code Maker

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the audited source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Collect static files
        shell: bash
        run: |
          set -euo pipefail
          mkdir site
          cp index.html .nojekyll site/
          mkdir -p site/web site/wasm
          cp -R web/code-maker site/web/
          cp -R web/api-reference site/web/
          cp web/styles.css web/shared.js site/web/
          mkdir -p site/wasm/api-reference
          cp wasm/api-reference/index.html site/wasm/api-reference/
          cp wasm/pyxel.js wasm/pyxel.css wasm/import_hook.py site/wasm/
          cp wasm/pyxel-2.9.9-cp311-abi3-emscripten_5_0_3_wasm32.whl site/wasm/
          cp -R wasm/images site/wasm/
          if find site -type l -print -quit | grep -q .; then
            echo "Refusing to publish symbolic links" >&2
            exit 1
          fi

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
